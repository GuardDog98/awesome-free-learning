<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Awesome Free Learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="220" rx="16" fill="url(#bg)"/>

  <circle cx="90" cy="170" r="6" fill="#38bdf8" opacity="0.5">
    <animate attributeName="cy" values="170;140;170" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="710" cy="60" r="8" fill="#a78bfa" opacity="0.5">
    <animate attributeName="cy" values="60;90;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="175" r="4" fill="#38bdf8" opacity="0.6">
    <animate attributeName="cy" values="175;150;175" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="45" r="5" fill="#a78bfa" opacity="0.6">
    <animate attributeName="cy" values="45;70;45" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <text x="400" y="100" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" opacity="0">
    Awesome Free Learning
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <rect x="250" y="115" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;300" dur="1.2s" begin="0.4s" fill="freeze"/>
  </rect>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#7dd3fc" text-anchor="middle">
    <text x="400" y="172" opacity="0">Programming
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="172" opacity="0">Computer Science
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.5;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="172" opacity="0">Data &amp; AI
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="172" opacity="0">Math &amp; Languages
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>